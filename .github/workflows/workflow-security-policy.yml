name: Workflow Security Policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "auto_upload/test_workflow_security.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "auto_upload/test_workflow_security.py"

permissions:
  contents: read

jobs:
  credential-path-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject credentials in caches and artifacts
        run: python3 auto_upload/test_workflow_security.py
