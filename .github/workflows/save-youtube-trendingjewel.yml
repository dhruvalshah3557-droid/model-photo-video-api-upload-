name: Save YouTube @trendingjewel token

on:
  workflow_dispatch:
    inputs:
      redirect_url:
        description: "Paste the full http://localhost/?code=... address after Google login. Leave empty to only get the login link."
        required: false
        type: string

permissions:
  contents: read

jobs:
  save:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto_upload
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create login link or save token
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REDIRECT_URL: ${{ inputs.redirect_url }}
        run: python save_youtube_trendingjewel.py
